# PSX project-shape policy for the Go Engine, CLI/TUI, and embedded local Web UI.
# Rules are an allow-list: omitted rules are intentionally not checked.
# Reference: https://github.com/m-mdy-m/psx/blob/main/docs/CONFIGURATION.md
version: 1

project:
  type: go
  kind: cli

rules:
  # Project basics
  readme: error
  license: error
  gitignore: warning
  gitattributes: info
  changelog: info
  env_example: warning
  package_manager: error # go.mod
  lockfile: error         # go.sum

  # Go layout uses cmd/ and internal/ rather than src/ and a top-level tests/ folder.
  src_folder: info
  tests_folder: info      # Go tests live next to the packages they exercise.
  scripts_folder: warning
  makefile: error
  docs_folder: error

  # Documentation and community standards
  contributing: error
  security: error
  code_of_conduct: warning
  architecture: error
  support: false
  adr: false
  roadmap: false
  pull_request_template: warning
  issue_templates: info
  api_docs: warning       # Browser API development notes live in docs/development/WEB_API.md
  openapi: false
  runbook: false

  # CI / supply-chain hygiene
  ci_config: error
  workflow_ci: error
  release_workflow: warning
  dependency_updates: error
  workflow_release: warning
  workflow_codeql: warning
  workflow_secret_scan: warning
  workflow_docker: false

  # Repository conventions
  editorconfig: info
  pre_commit: info
  code_owners: info
  node_version: false # Node/pnpm are a scoped build-time toolchain under clients/web/, not the root runtime

  # IDIOS runs as a desktop-local application with an optional loopback service.
  dockerfile: false
  dockerignore: false
  docker_compose: false
  kubernetes: false
  nginx: false
  funding: false

ignore:
  - .git/
  - build/
  - bin/
  - dist/
  - coverage/
  - vendor/
  - .psx/
  - .psx-project.yml
  - "*.sqlite3"
  - "*.sqlite3-wal"
  - "*.sqlite3-shm"

fix:
  interactive: false
  backup: true
