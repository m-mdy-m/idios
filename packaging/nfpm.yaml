name: idios
arch: ${TARGET_GOARCH}
platform: linux
version: ${VERSION}
version_schema: semver
maintainer: IDIOS contributors
description: Local-first workspace for projects, issues, ideas, and connected knowledge.
vendor: IDIOS
homepage: https://github.com/m-mdy-m/idios
license: MPL-2.0

contents:
  - src: dist/idios
    dst: /usr/bin/idios
    file_info:
      mode: 0755
  - src: dist/idios-tui
    dst: /usr/bin/idios-tui
    file_info:
      mode: 0755
  - src: README.md
    dst: /usr/share/doc/idios/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/idios/LICENSE
    file_info:
      mode: 0644
