name: idios
arch: ${TARGET_GOARCH}
platform: linux
version: ${VERSION}
version_schema: semver
maintainer: IDIOS contributors
description: Local-first work tracker with CLI and embedded Web workspace.
vendor: IDIOS
homepage: https://github.com/m-mdy-m/idios
license: MPL-2.0

contents:
  - src: dist/idios
    dst: /usr/bin/idios
    file_info:
      mode: 0755
  - src: README.md
    dst: /usr/share/doc/idios/README.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/idios/LICENSE
    file_info:
      mode: 0644
