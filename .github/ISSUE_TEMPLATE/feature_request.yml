name: Feature request
description: Propose a focused improvement to the IDIOS Engine or its adapters.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        IDIOS aims to remain local-first, deterministic and modular. Prefer one concrete use case over a broad feature wishlist.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you solving?
      description: Describe the user workflow that is difficult today.
      placeholder: "When I connect issues between CPU and ARLIZ, I cannot ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What would the CLI/TUI accept and what result should it show?
      placeholder: |
        Command or TUI flow:
        Expected output:
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Main area
      options:
        - Domain / workflow
        - SQLite storage / migration
        - CLI / JSON protocol
        - TUI / Graph Explorer
        - Documentation / CI
        - Future GUI / IPC
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional context
    validations:
      required: false
