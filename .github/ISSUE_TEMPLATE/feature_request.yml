name: Feature request
description: Propose one focused improvement to IDIOS.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        IDIOS stays small and deterministic. Requests that start from one concrete workflow
        are easier to accept than broad wishlists. For open-ended ideas, use
        [Discussions](https://github.com/m-mdy-m/idios/discussions) first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and discussions.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow that is hard or impossible today. Leave the solution for the next field.
      placeholder: "When I link issues across CPU and ARLIZ, I cannot see which one is blocking the other."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What would you type or press, and what would you see? Rough examples are fine.
      placeholder: |
        Command or TUI flow:
        Expected output:
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Main area
      options:
        - Domain / workflow rules
        - SQLite storage / migration
        - CLI / JSON protocol
        - TUI / Graph Explorer
        - Documentation / CI
        - Future GUI / IPC
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: How will we know it works?
      description: Two or three checkable outcomes.
      placeholder: |
        - [ ] ...
        - [ ] Works keyboard-only
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why you prefer this one. Include any cost or risk you see.
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement it?
      options:
        - "Yes"
        - Maybe, with guidance
        - "No"
    validations:
      required: false
