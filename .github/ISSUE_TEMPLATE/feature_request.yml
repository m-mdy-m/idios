name: Feature request
description: Propose a new capability or improvement.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        IDIOS is small on purpose. Before proposing, ask: does this help someone learn?

  - type: textarea
    id: problem
    attributes:
      label: What problem are you solving?
      description: Describe the situation where IDIOS falls short today, not just "add feature X".
      placeholder: "When I have 200 concepts, `:search` returns too many unrelated results because ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you type, and what would you see? Which command or input form?
      placeholder: |
        > :review old
        ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part does this touch?
      multiple: true
      options:
        - Shell input (new form or command)
        - Questions and answers
        - Notes, highlights, quotes
        - Sources and shelf
        - Concepts and graph
        - Planning and reminders
        - Search
        - Export
        - Storage
        - Documentation
        - CI / tooling
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context
    validations:
      required: false
