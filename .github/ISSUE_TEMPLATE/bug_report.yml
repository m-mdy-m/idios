name: Bug report
description: A reproducible problem in the Go Engine, CLI or TUI.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, try the latest commit and include the exact command or TUI action that failed.
        Do not upload a personal SQLite database; redact paths and sensitive content.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and the operation you were attempting.
      placeholder: "`idios issue start --id ARLIZ#3` returns ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands or TUI key sequence that demonstrates the problem.
      placeholder: |
        1. `idios --db ./test.sqlite3 repo create --name CPU`
        2. `idios --db ./test.sqlite3 issue list --repo CPU`
        3. Observe the incorrect output
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste `go version`, OS, architecture, whether `CGO_ENABLED=1`, and whether this was CLI or TUI.
      placeholder: |
        go version go1.25.x linux/amd64
        OS: Linux
        UI: TUI
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error or output
      description: Relevant error/output. Remove secrets and personal data.
      render: text
    validations:
      required: false

  - type: textarea
    id: database
    attributes:
      label: Database / migration context
      description: Engine schema version if known; never attach the database itself.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional context
    validations:
      required: false
