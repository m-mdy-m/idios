name: Publish to PyPI

# Runs after the Release workflow creates the GitHub release.
# Trusts the release workflow to have run tests; doesn't re-run them.
#
# Setup required (one-time):
#   1. Go to https://pypi.org/manage/account/publishing/
#   2. Add a Trusted Publisher for this repo + workflow.
#   3. Set environment name to "pypi" (matches `environment` below).
#   No PYPI_API_TOKEN secret needed — OIDC handles auth.

on:
  release:
    types: [published]    # fires when a non-draft release is published

permissions:
  id-token: write         # OIDC token for Trusted Publishing
  contents: read

jobs:
  # ── optional: publish to Test PyPI first for non-pre-releases ───────────
  publish-testpypi:
    name: Publish → Test PyPI
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    environment:
      name: testpypi
      url: https://test.pypi.org/p/idios

    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1.11
        with:
          releaseId: ${{ github.event.release.id }}
          fileName: "*.whl"
          out-file-path: dist/

      - name: Download sdist
        uses: robinraju/release-downloader@v1.11
        with:
          releaseId: ${{ github.event.release.id }}
          fileName: "*.tar.gz"
          out-file-path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  # ── publish to PyPI (production) ─────────────────────────────────────────
  publish-pypi:
    name: Publish → PyPI
    runs-on: ubuntu-latest
    needs: publish-testpypi
    if: "!github.event.release.prerelease"
    environment:
      name: pypi
      url: https://pypi.org/p/idios

    steps:
      - name: Download wheel from release
        uses: robinraju/release-downloader@v1.11
        with:
          releaseId: ${{ github.event.release.id }}
          fileName: "*.whl"
          out-file-path: dist/

      - name: Download sdist from release
        uses: robinraju/release-downloader@v1.11
        with:
          releaseId: ${{ github.event.release.id }}
          fileName: "*.tar.gz"
          out-file-path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  # ── pre-releases go straight to Test PyPI only ───────────────────────────
  publish-prerelease:
    name: Publish pre-release → Test PyPI
    runs-on: ubuntu-latest
    if: github.event.release.prerelease
    environment:
      name: testpypi
      url: https://test.pypi.org/p/idios

    steps:
      - name: Download wheel from release
        uses: robinraju/release-downloader@v1.11
        with:
          releaseId: ${{ github.event.release.id }}
          fileName: "*.whl"
          out-file-path: dist/

      - name: Download sdist from release
        uses: robinraju/release-downloader@v1.11
        with:
          releaseId: ${{ github.event.release.id }}
          fileName: "*.tar.gz"
          out-file-path: dist/

      - name: Publish pre-release to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
