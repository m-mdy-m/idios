name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, test, vet and smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install C compiler
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Install PSX
        run: go install github.com/m-mdy-m/psx/cmd/psx@v3.0.0
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Download modules
        run: go mod download
      - name: Check project shape
        run: make psx-check
      - name: Run quality gate
        run: make check
      - name: Race tests
        run: make test-race
      - name: Build and workflow smoke test
        run: make smoke
