name: IDIOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: m-mdy-m/pipeline/.github/workflows/ci.yml@main
    with:
      language: go
      go-version: "1.25.0"
      build-command: |
        corepack enable
        corepack prepare pnpm@9.15.4 --activate
        python scripts/run-pipeline.py validate
      test-command: python scripts/run-pipeline.py run ci
      lint-command: git diff --check
