name: IDIOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate and run the IDIOS task graph
    uses: m-mdy-m/pipeline/.github/workflows/ci.yml@main
    with:
      language: go
      go-version: "1.25.0"
      setup-node: true
      node-version: "22"
      pnpm-version: "9.15.4"
      pipeline-task: ci
      pipeline-ref: main
