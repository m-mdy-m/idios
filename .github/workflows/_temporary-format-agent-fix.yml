name: Temporary Go formatting repair

on:
  push:
    branches: ["fix/shelf-agent-discussion-reliability"]
    paths:
      - ".github/workflows/_temporary-format-agent-fix.yml"

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/shelf-agent-discussion-reliability
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Apply gofmt to changed Go sources
        run: gofmt -w internal/ai/runtime.go internal/ai/runtime_test.go
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Go sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/ai/runtime.go internal/ai/runtime_test.go
          git commit -m "style(ai): apply gofmt to discussion reliability changes"
          git push origin HEAD:fix/shelf-agent-discussion-reliability
