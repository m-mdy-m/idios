name: IDIOS Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idios-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan the repository for committed secrets
    uses: m-mdy-m/pipeline/.github/workflows/security-check.yml@main
    with:
      scan-path: .
