name: Go Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install C compiler
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Download modules
        run: go mod download
      - name: Test and vet
        run: make check
      - name: Race tests
        run: make test-race
      - name: Workflow smoke test
        run: make smoke

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-amd64
            exe: ""
          - os: macos-14
            asset: darwin-arm64
            exe: ""
          - os: windows-latest
            asset: windows-amd64
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Install Windows C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Install Unix C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Download modules
        run: go mod download
      - name: Build binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o "release/idios${{ matrix.exe }}" ./cmd/idios
          CGO_ENABLED=1 go build -trimpath -ldflags='-s -w' -o "release/idios-tui${{ matrix.exe }}" ./cmd/idios-tui
          cp README.md LICENSE docs/TUI.md release/
          tar -czf "idios-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz" -C release .
      - name: Build binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $env:CGO_ENABLED = '1'
          go build -trimpath -ldflags='-s -w' -o 'release/idios.exe' ./cmd/idios
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags='-s -w' -o 'release/idios-tui.exe' ./cmd/idios-tui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item README.md, LICENSE, docs/TUI.md release/
          Compress-Archive -Path release/* -DestinationPath "idios-${{ github.ref_name }}-${{ matrix.asset }}.zip" -Force
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: idios-${{ matrix.asset }}
          path: idios-${{ github.ref_name }}-${{ matrix.asset }}.*
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: idios-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: cd release-assets && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "IDIOS ${{ github.ref_name }}"
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
