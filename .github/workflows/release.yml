name: Go Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install C compiler
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Run make check
        run: make check
      - name: Race tests
        run: make test-race
      - name: Build and run end-to-end smoke test
        run: make smoke

  build:
    name: Build and test ${{ matrix.asset }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: linux-amd64
            cc: gcc
            exe: ''
            archive: tar.gz
          - runner: ubuntu-22.04-arm
            asset: linux-arm64
            cc: gcc
            exe: ''
            archive: tar.gz
          - runner: macos-15-intel
            asset: darwin-amd64
            cc: clang
            exe: ''
            archive: tar.gz
          - runner: macos-15
            asset: darwin-arm64
            cc: clang
            exe: ''
            archive: tar.gz
          - runner: windows-2025
            asset: windows-amd64
            cc: gcc
            exe: '.exe'
            archive: zip
          - runner: windows-11-arm
            asset: windows-arm64
            cc: clang
            exe: '.exe'
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      CC: ${{ matrix.cc }}
    steps:
      - name: Validate semantic version tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1; got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Checkout tagged source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install Windows amd64 C toolchain
        if: matrix.asset == 'windows-amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Install Windows ARM64 C toolchain
        if: matrix.asset == 'windows-arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: mingw-w64-clang-aarch64-clang
      - name: Install Linux C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Download modules
        run: go mod download
      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Go files need gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Build CLI and both TUI variants
        shell: bash
        env:
          EXE_SUFFIX: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BASE_LDFLAGS='-s -w -linkmode external -extldflags=-static'
          else
            BASE_LDFLAGS='-s -w'
          fi
          CLI_LDFLAGS="$BASE_LDFLAGS -X idios/internal/cli.Version=${VERSION}"
          go build -trimpath -ldflags="$CLI_LDFLAGS" -o "dist/idios${EXE_SUFFIX}" ./cmd/idios
          go build -trimpath -ldflags="$BASE_LDFLAGS" -o "dist/idios-tui${EXE_SUFFIX}" ./cmd/idios-tui
          go build -trimpath -ldflags="$BASE_LDFLAGS" -o "dist/idios-tui-demo${EXE_SUFFIX}" ./cmd/idios-tui-demo
      - name: Smoke-test native executables
        shell: bash
        env:
          EXE_SUFFIX: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          IDIOS_EXPECT_VERSION="${GITHUB_REF_NAME#v}" IDIOS_BIN="dist/idios${EXE_SUFFIX}" IDIOS_TUI_BIN="dist/idios-tui${EXE_SUFFIX}" IDIOS_TUI_DEMO_BIN="dist/idios-tui-demo${EXE_SUFFIX}" sh ./scripts/smoke-platform.sh
      - name: Package Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXE_SUFFIX: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp "dist/idios${EXE_SUFFIX}" "dist/idios-tui${EXE_SUFFIX}" release/
          cp README.md LICENSE release/
          test ! -e release/idios-tui-demo
          test ! -e release/idios-tui-demo.exe
          test "$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
          tar -czf "idios-${GITHUB_REF_NAME}-${{ matrix.asset }}.tar.gz" -C release .
      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/idios.exe, dist/idios-tui.exe, README.md, LICENSE -Destination release/
          Compress-Archive -Path release/* -DestinationPath "idios-$env:GITHUB_REF_NAME-${{ matrix.asset }}.zip" -Force
      - name: Build Linux DEB and RPM packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          TARGET_GOARCH: ${{ matrix.asset == 'linux-arm64' && 'arm64' || 'amd64' }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          sudo apt-get update
          sudo apt-get install -y rpm
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          PATH="$(go env GOPATH)/bin:$PATH"
          export PATH
          nfpm package --config packaging/nfpm.yaml --packager deb --target "idios-${GITHUB_REF_NAME}-${ASSET}.deb"
          nfpm package --config packaging/nfpm.yaml --packager rpm --target "idios-${GITHUB_REF_NAME}-${ASSET}.rpm"
          dpkg-deb --info "idios-${GITHUB_REF_NAME}-${ASSET}.deb" >/dev/null
          rpm -qp --qf '%{NAME} %{VERSION} %{ARCH}\n' "idios-${GITHUB_REF_NAME}-${ASSET}.rpm"
      - name: Build macOS PKG and DMG installers
        if: runner.os == 'macOS'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          bash ./scripts/package-macos.sh "${GITHUB_REF_NAME#v}" "$GITHUB_REF_NAME" "$ASSET"
      - name: Build Windows setup installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @([Environment]::GetFolderPath('ProgramFilesX86'), [Environment]::GetFolderPath('ProgramFiles'))
          $compiler = $null
          foreach ($root in $roots) {
            foreach ($version in @('Inno Setup 7', 'Inno Setup 6')) {
              $candidate = Join-Path $root "$version\ISCC.exe"
              if (Test-Path $candidate) { $compiler = $candidate; break }
            }
            if ($compiler) { break }
          }
          if (-not $compiler) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Failed to install Inno Setup.' }
            foreach ($root in $roots) {
              foreach ($version in @('Inno Setup 7', 'Inno Setup 6')) {
                $candidate = Join-Path $root "$version\ISCC.exe"
                if (Test-Path $candidate) { $compiler = $candidate; break }
              }
              if ($compiler) { break }
            }
          }
          if (-not $compiler) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          & $compiler '/O.' 'packaging/windows/idios.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }
          $installer = "idios-$env:GITHUB_REF_NAME-$env:ASSET-setup.exe"
          if (-not (Test-Path $installer)) { throw "Expected installer was not created: $installer" }
      - name: Upload release bundles and native installers
        uses: actions/upload-artifact@v4
        with:
          name: idios-${{ matrix.asset }}
          path: |
            idios-${{ github.ref_name }}-${{ matrix.asset }}.*
            idios-${{ github.ref_name }}-${{ matrix.asset }}-setup.exe
          if-no-files-found: error
          retention-days: 5

  verify-bundles:
    name: Download and execute pre-release ${{ matrix.asset }} bundle
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: linux-amd64
            archive: tar.gz
            exe: ''
          - runner: ubuntu-22.04-arm
            asset: linux-arm64
            archive: tar.gz
            exe: ''
          - runner: macos-15-intel
            asset: darwin-amd64
            archive: tar.gz
            exe: ''
          - runner: macos-15
            asset: darwin-arm64
            archive: tar.gz
            exe: ''
          - runner: windows-2025
            asset: windows-amd64
            archive: zip
            exe: '.exe'
          - runner: windows-11-arm
            asset: windows-arm64
            archive: zip
            exe: '.exe'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout source for smoke scripts
        uses: actions/checkout@v4
      - name: Download this platform's packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: idios-${{ matrix.asset }}
          path: artifact
      - name: Extract Unix bundle
        if: runner.os != 'Windows'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          tar -xzf "artifact/idios-${GITHUB_REF_NAME}-${ASSET}.${ARCHIVE}" -C bundle
      - name: Extract Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          $archive = Get-ChildItem artifact/*.zip | Select-Object -First 1
          if (-not $archive) { throw 'Windows release artifact archive is missing.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath bundle -Force
      - name: Validate and smoke-test installed Linux DEB package
        if: runner.os == 'Linux'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          deb="artifact/idios-${GITHUB_REF_NAME}-${ASSET}.deb"
          rpm_pkg="artifact/idios-${GITHUB_REF_NAME}-${ASSET}.rpm"
          dpkg-deb --info "$deb" >/dev/null
          rpm -qp --qf '%{NAME} %{VERSION} %{ARCH}\n' "$rpm_pkg"
          rpm -qpl "$rpm_pkg" | grep -Fx '/usr/bin/idios' 
          rpm -qpl "$rpm_pkg" | grep -Fx '/usr/bin/idios-tui'
                    dpkg-deb --contents "$deb" > package-contents.txt
          grep -Eq '\./usr/bin/idios$' package-contents.txt
          grep -Eq '\./usr/bin/idios-tui$' package-contents.txt
                    sudo dpkg -i "$deb"
          IDIOS_EXPECT_VERSION="${GITHUB_REF_NAME#v}" IDIOS_BIN="/usr/bin/idios" IDIOS_TUI_BIN="/usr/bin/idios-tui" sh ./scripts/smoke-release.sh
      - name: Validate macOS PKG and DMG payloads
        if: runner.os == 'macOS'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          pkg="artifact/idios-${GITHUB_REF_NAME}-${ASSET}.pkg"
          dmg="artifact/idios-${GITHUB_REF_NAME}-${ASSET}.dmg"
          pkgutil --payload-files "$pkg" > pkg-payload.txt
          grep -Eq '(^|/)bin/idios$' pkg-payload.txt
          grep -Eq '(^|/)bin/idios-tui$' pkg-payload.txt
          ! grep -Eq '(^|/)bin/idios-tui-demo$' pkg-payload.txt
          mountpoint="$(mktemp -d "${TMPDIR:-/tmp}/idios-dmg.XXXXXX")"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" >/dev/null
          trap 'hdiutil detach "$mountpoint" -quiet || true; rmdir "$mountpoint" 2>/dev/null || true' EXIT
          test -f "$mountpoint/idios-${GITHUB_REF_NAME}-${ASSET}.pkg"
      - name: Install and smoke-test macOS PKG package
        if: runner.os == 'macOS'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          sudo installer -pkg "artifact/idios-${GITHUB_REF_NAME}-${ASSET}.pkg" -target /
          IDIOS_EXPECT_VERSION="${GITHUB_REF_NAME#v}" \
          IDIOS_BIN="/usr/local/bin/idios" \
          IDIOS_TUI_BIN="/usr/local/bin/idios-tui" \
          sh ./scripts/smoke-release.sh
      - name: Install Windows setup and verify installed files
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installerPath = Join-Path $PWD "artifact/idios-$env:GITHUB_REF_NAME-$env:ASSET-setup.exe"
          if (-not (Test-Path $installerPath)) { throw "Windows setup installer is missing: $installerPath" }
          $installDir = Join-Path $PWD 'installer-test'
          $proc = Start-Process -FilePath $installerPath -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDir") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Windows setup exited with code $($proc.ExitCode)." }
          foreach ($binary in @('idios.exe', 'idios-tui.exe')) {
            if (-not (Test-Path (Join-Path $installDir $binary))) { throw "Installed executable is missing: $binary" }
          }
          foreach ($file in @('README.md', 'LICENSE')) {
            if (-not (Test-Path (Join-Path (Join-Path $installDir 'docs') $file))) { throw "Installed documentation is missing: $file" }
          }
          if (Test-Path (Join-Path $installDir 'idios-tui-demo.exe')) { throw 'Demo TUI must not be installed for end users.' }
      - name: Execute packaged binaries without build-toolchain setup
        shell: bash
        env:
          EXE_SUFFIX: ${{ matrix.exe }}
          IDIOS_EXPECT_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            filtered_path="$(printf '%s' "$PATH" | tr ':' '\n' | grep -Eiv '(msys64|mingw|ucrt64|clangarm64|gcc)' || true)"
            if [[ -n "$filtered_path" ]]; then
              PATH="$(printf '%s\n' "$filtered_path" | paste -sd ':' -)"
              export PATH
            fi
          fi
          IDIOS_EXPECT_VERSION="${IDIOS_EXPECT_VERSION#v}" \
          IDIOS_BIN="bundle/idios${EXE_SUFFIX}" \
          IDIOS_TUI_BIN="bundle/idios-tui${EXE_SUFFIX}" \
          sh ./scripts/smoke-release.sh
      - name: Smoke-test installed Windows setup
        if: runner.os == 'Windows'
        shell: bash
        env:
          IDIOS_EXPECT_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IDIOS_EXPECT_VERSION="${IDIOS_EXPECT_VERSION#v}" \
          IDIOS_BIN="installer-test/idios.exe" \
          IDIOS_TUI_BIN="installer-test/idios-tui.exe" \
          sh ./scripts/smoke-release.sh


  publish:
    name: Publish GitHub Release
    needs: verify-bundles
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all native bundles
        uses: actions/download-artifact@v4
        with:
          pattern: idios-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum idios-* > SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "IDIOS ${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-published-download:
    name: Download and execute ${{ matrix.asset }} release
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: linux-amd64
            archive: tar.gz
            exe: ''
          - runner: ubuntu-22.04-arm
            asset: linux-arm64
            archive: tar.gz
            exe: ''
          - runner: macos-15-intel
            asset: darwin-amd64
            archive: tar.gz
            exe: ''
          - runner: macos-15
            asset: darwin-arm64
            archive: tar.gz
            exe: ''
          - runner: windows-2025
            asset: windows-amd64
            archive: zip
            exe: '.exe'
          - runner: windows-11-arm
            asset: windows-arm64
            archive: zip
            exe: '.exe'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout release source for smoke scripts
        uses: actions/checkout@v4
      - name: Download and verify published assets (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p release-download/unpacked
          patterns=(--pattern "idios-${GITHUB_REF_NAME}-${ASSET}.${ARCHIVE}" --pattern 'SHA256SUMS.txt')
          files=("release-download/idios-${GITHUB_REF_NAME}-${ASSET}.${ARCHIVE}")
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            patterns+=(--pattern "idios-${GITHUB_REF_NAME}-${ASSET}.deb" --pattern "idios-${GITHUB_REF_NAME}-${ASSET}.rpm")
            files+=("release-download/idios-${GITHUB_REF_NAME}-${ASSET}.deb" "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.rpm")
          else
            patterns+=(--pattern "idios-${GITHUB_REF_NAME}-${ASSET}.pkg" --pattern "idios-${GITHUB_REF_NAME}-${ASSET}.dmg")
            files+=("release-download/idios-${GITHUB_REF_NAME}-${ASSET}.pkg" "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.dmg")
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${patterns[@]}" --dir release-download
          for asset_file in "${files[@]}"; do
            sh ./scripts/verify-checksum.sh "$asset_file" release-download/SHA256SUMS.txt
          done
          tar -xzf "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.${ARCHIVE}" -C release-download/unpacked
          test ! -e "release-download/unpacked/idios-tui-demo"
          test ! -e "release-download/unpacked/idios-tui-demo.exe"
          test -f release-download/unpacked/README.md
          test -f release-download/unpacked/LICENSE
          test "$(find release-download/unpacked -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y rpm
            dpkg-deb --info "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.deb" >/dev/null
            rpm -qp --qf '%{NAME} %{VERSION} %{ARCH}\n' "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.rpm"
            rpm -qpl "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.rpm" | grep -Fx '/usr/bin/idios'
            rpm -qpl "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.rpm" | grep -Fx '/usr/bin/idios-tui'
                        dpkg-deb --contents "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.deb" > release-download/deb-contents.txt
                        sudo dpkg -i "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.deb"
          else
            pkgutil --payload-files "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.pkg" > release-download/pkg-payload.txt
            grep -Eq '(^|/)bin/idios$' release-download/pkg-payload.txt
            grep -Eq '(^|/)bin/idios-tui$' release-download/pkg-payload.txt
            ! grep -Eq '(^|/)bin/idios-tui-demo$' release-download/pkg-payload.txt
            mountpoint="$(mktemp -d "${TMPDIR:-/tmp}/idios-published-dmg.XXXXXX")"
            hdiutil attach "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.dmg" -nobrowse -readonly -mountpoint "$mountpoint" >/dev/null
            trap 'hdiutil detach "$mountpoint" -quiet || true; rmdir "$mountpoint" 2>/dev/null || true' EXIT
            test -f "$mountpoint/idios-${GITHUB_REF_NAME}-${ASSET}.pkg"
            sudo installer -pkg "release-download/idios-${GITHUB_REF_NAME}-${ASSET}.pkg" -target /
          fi
      - name: Download, verify and install published Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-download/unpacked | Out-Null
          $archive = "idios-$env:GITHUB_REF_NAME-$env:ASSET.zip"
          $installer = "idios-$env:GITHUB_REF_NAME-$env:ASSET-setup.exe"
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern $archive --pattern $installer --pattern 'SHA256SUMS.txt' --dir release-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @($archive, $installer)) {
            $line = Get-Content release-download/SHA256SUMS.txt | Where-Object { $_ -match "\s+$([regex]::Escape($name))$" } | Select-Object -First 1
            if (-not $line) { throw "Checksum entry missing for $name" }
            $expected = ($line -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash "release-download/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA-256 mismatch for $name" }
          }
          Expand-Archive -LiteralPath "release-download/$archive" -DestinationPath release-download/unpacked -Force
          if (Test-Path 'release-download/unpacked/idios-tui-demo.exe') { throw 'Release archive must not contain the demo TUI.' }
          $archiveFiles = @(Get-ChildItem release-download/unpacked -File)
          if ($archiveFiles.Count -ne 4) { throw "Expected exactly four user-facing archive files, found $($archiveFiles.Count)." }
          foreach ($required in @('idios.exe', 'idios-tui.exe', 'README.md', 'LICENSE')) {
            if (-not (Test-Path (Join-Path 'release-download/unpacked' $required))) { throw "Release archive is missing $required." }
          }
          $installDir = Join-Path $PWD 'published-installer'
          $installerPath = (Resolve-Path "release-download/$installer").Path
          $proc = Start-Process -FilePath $installerPath -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDir") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Published Windows setup exited with code $($proc.ExitCode)." }
          foreach ($binary in @('idios.exe', 'idios-tui.exe')) {
            if (-not (Test-Path (Join-Path $installDir $binary))) { throw "Published installer did not install $binary." }
          }
          foreach ($file in @('README.md', 'LICENSE')) {
            if (-not (Test-Path (Join-Path (Join-Path $installDir 'docs') $file))) { throw "Published installer is missing $file." }
          }
          if (Test-Path (Join-Path $installDir 'idios-tui-demo.exe')) { throw 'Published installer must not include the demo TUI.' }
      - name: Execute published Windows installer binaries
        if: runner.os == 'Windows'
        shell: bash
        env:
          IDIOS_EXPECT_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IDIOS_EXPECT_VERSION="${IDIOS_EXPECT_VERSION#v}" \
          IDIOS_BIN="published-installer/idios.exe" \
          IDIOS_TUI_BIN="published-installer/idios-tui.exe" \
          sh ./scripts/smoke-release.sh
      - name: Smoke-test installed published Linux/macOS package
        if: runner.os != 'Windows'
        shell: bash
        env:
          IDIOS_EXPECT_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            IDIOS_BIN="/usr/bin/idios"
            IDIOS_TUI_BIN="/usr/bin/idios-tui"
          else
            IDIOS_BIN="/usr/local/bin/idios"
            IDIOS_TUI_BIN="/usr/local/bin/idios-tui"
          fi
          export IDIOS_BIN IDIOS_TUI_BIN
          IDIOS_EXPECT_VERSION="${IDIOS_EXPECT_VERSION#v}" sh ./scripts/smoke-release.sh
      - name: Execute downloaded CLI and SQLite workflow
        shell: bash
        env:
          EXE_SUFFIX: ${{ matrix.exe }}
          IDIOS_EXPECT_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            filtered_path="$(printf '%s' "$PATH" | tr ':' '\n' | grep -Eiv '(msys64|mingw|ucrt64|clangarm64|gcc)' || true)"
            if [[ -n "$filtered_path" ]]; then
              PATH="$(printf '%s\n' "$filtered_path" | paste -sd ':' -)"
              export PATH
            fi
          fi
          IDIOS_EXPECT_VERSION="${IDIOS_EXPECT_VERSION#v}" \
          IDIOS_BIN="release-download/unpacked/idios${EXE_SUFFIX}" \
          IDIOS_TUI_BIN="release-download/unpacked/idios-tui${EXE_SUFFIX}" \
          sh ./scripts/smoke-release.sh
