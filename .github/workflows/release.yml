name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-releases: v0.3.0-alpha.1

permissions:
  contents: write   # create GitHub releases

jobs:
  # ── Job 1: validate ─────────────────────────────────────────────────────────
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      prerelease: ${{ steps.extract.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version and check CHANGELOG
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

          # Determine if this is a pre-release (contains a hyphen)
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # Require a CHANGELOG entry for non-pre-releases
          if [[ "$TAG" != *-* ]]; then
            if ! grep -q "## \[$TAG\]" CHANGELOG.md; then
              echo "ERROR: No CHANGELOG entry for [$TAG] — add one before tagging."
              exit 1
            fi
          fi

  # ── Job 2: tests must pass on the tagged commit ───────────────────────────
  test:
    name: Tests (release gate)
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --tb=short
        env:
          IDIOS_CONFIG_DIR: configs

  # ── Job 3: build sdist + wheel ────────────────────────────────────────────
  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Show built files
        run: ls -lh dist/

      - name: Artifact name
        id: meta
        run: echo "artifact-name=dist-${{ needs.validate.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ── Job 4: create GitHub release ─────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          if grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            # Extract the section for this version (stop at the next ## [)
            sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md \
              | head -n -1 \
              > release_notes.md
          else
            echo "## Release v${VERSION}" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." >> release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "idios v${{ needs.validate.outputs.version }}"
          body_path: release_notes.md
          prerelease: ${{ needs.validate.outputs.prerelease }}
          draft: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
