schema_version = 1

[project]
name = "idios"
description = "Local-first CLI and Web learning workspace"

[defaults]
timeout_seconds = 900
fail_fast = true

[tasks.docs]
description = "Validate IDIOS documentation entry points and local references"
command = ["python", "scripts/check-docs.py"]
timeout_seconds = 120

[tasks.format]
description = "Check formatting of all Go packages"
command = ["make", "fmt-check"]
timeout_seconds = 120

[tasks.go-test]
description = "Run the complete Go unit and integration test suite"
command = ["make", "test"]
timeout_seconds = 900

[tasks.go-vet]
description = "Run go vet across all Go packages"
command = ["make", "vet"]
timeout_seconds = 600

[tasks.web-lint]
description = "Install the Web workspace dependencies and lint the frontend"
command = ["make", "web-lint"]
timeout_seconds = 900

[tasks.check]
description = "Run documentation, formatting, Go, and Web quality checks"
command = ["python", "-c", "print('IDIOS quality checks completed')"]
depends_on = ["docs", "format", "go-test", "go-vet", "web-lint"]
timeout_seconds = 30

[tasks.race]
description = "Run the Go test suite with the race detector"
command = ["make", "test-race"]
depends_on = ["check"]
timeout_seconds = 1800

[tasks.build]
description = "Build the embedded Web frontend and the single IDIOS executable"
command = ["make", "build"]
depends_on = ["race"]
timeout_seconds = 1800

[tasks.smoke]
description = "Build and smoke-test the CLI, embedded Web server, and SQLite workflow"
command = ["make", "smoke"]
depends_on = ["build"]
timeout_seconds = 900

[tasks.ai-agent-model-integration]
description = "Pull the local Qwen model with Ollama and run the real sequential Shelf discussion integration test"
command = ["bash", "scripts/test-ai-agent-ollama.sh"]
timeout_seconds = 1800

[tasks.ci]
description = "Run the complete IDIOS CI task graph"
command = ["python", "-c", "print('IDIOS CI task graph completed successfully')"]
depends_on = ["smoke"]
timeout_seconds = 30
