[project]
name = "idios"
version = "0.3.0"
description = "IDIOS: a local-first personal learning environment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# No runtime dependencies on purpose: standard library only, works offline.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
idios = "idios.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]