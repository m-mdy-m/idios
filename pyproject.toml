[project]
name = "idios"
version = "0.2.0"
description = "IDIOS - personal cognitive and learning operating system (local-first)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
idios = "idios.cli.main:main"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
